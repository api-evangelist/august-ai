aid: august-ai
name: August AI
description: 'August AI is a consumer health-AI companion that helps people understand
  their symptoms, lab reports, prescriptions, and medications, and connects them to
  licensed physicians through asynchronous, chat-based telehealth visits. Founded in
  2022 by Anuruddh Mishra after a four-month misdiagnosis, August operates as a 24/7
  health assistant available on iOS, Android, and WhatsApp, storing lab reports and
  conversation history in long-term memory to deliver personalized guidance. The service
  pairs a free AI symptom-assessment experience with paid online doctor consultations
  from board-certified MDs licensed across all 50 US states. August reports serving
  millions of users across 160+ countries in 30+ languages, and publishes medical
  benchmarks including 100% accuracy on the USMLE, 97.4% on MedQA, 99.4% on lab-report
  document processing, and 100% precision/recall on emergency escalation. It is backed
  by Accel and Claypond Capital. August is a consumer application and does not currently
  publish a developer API, SDK, or developer portal.'
